<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的TODO列表工具 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-image: url('https://n.sinaimg.cn/sinakd20112/668/w2048h1020/20240227/6ee2-afa9253c6a9bd39ebc8e544315aead79.jpg');
            background-size: cover;  /* 图片覆盖整个背景 */
            background-position: center;  /* 图片居中 */
            background-attachment: fixed;  /* 背景固定不动 */
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: transparent;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: rgba(102, 126, 234, 0.3);  /* 30%不透明的紫色 */
            backdrop-filter: blur(10px);  /* 毛玻璃效果 */
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .task-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .task-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3838;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 14px;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background: #eaedf0;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
        }

        .task-description {
            font-size: 16px;
            color: #333;
        }

        .task-item.completed .task-description {
            text-decoration: line-through;
            color: #999;
        }

                .task-meta {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: slideInRight 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.success {
            border-left: 4px solid #00b894;
        }

        .message.error {
            border-left: 4px solid #ff4757;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .task-item {
                flex-wrap: wrap;
            }

            .task-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

            </style>
</head>
<body>
    <!-- 登录注册容器 -->
    <div id="authContainer">
        <!-- 登录表单 -->
        <div id="loginBox" class="container" style="display: block;">
            <div class="header">
                <h1>🔐 登录</h1>
                <p>请登录以继续</p>
            </div>
            <div class="content">
                <input type="text" id="loginUsername" placeholder="用户名" class="task-input" style="margin-bottom:10px">
                <input type="password" id="loginPassword" placeholder="密码" class="task-input" style="margin-bottom:10px">
                <button class="btn btn-primary" onclick="login()">登录</button>
                <button class="btn btn-secondary" onclick="showRegister()">去注册</button>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerBox" class="container" style="display: none;">
            <div class="header">
                <h1>📝 注册</h1>
                <p>创建新账号</p>
            </div>
            <div class="content">
                <input type="text" id="regUsername" placeholder="用户名" class="task-input" style="margin-bottom:10px">
                <input type="password" id="regPassword" placeholder="密码" class="task-input" style="margin-bottom:10px">
                <button class="btn btn-primary" onclick="register()">注册</button>
                <button class="btn btn-secondary" onclick="showLogin()">返回登录</button>
            </div>
        </div>
    </div>

    <div id="todoApp" class="container" style="display: none;">
        <div class="header">
            <h1>📝 TODO列表</h1>
            <p>高效管理你的任务清单</p>
            <button onclick="logout()" style="margin-top: 10px; background: #ff4757; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer;">🚪 退出登录</button>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <input type="text" id="taskInput" class="task-input" placeholder="输入新任务..." @keyup.enter="addTask">
                    <button class="btn btn-primary" onclick="addTask()">➕ 添加任务</button>
                </div>
            </div>

            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">待办</div>
                </div>
            </div>

            <ul class="task-list" id="taskList">
                <li class="empty-state">
                    <div>✨ 暂无任务</div>
                    <div style="font-size: 14px; margin-top: 10px;">添加一个新任务开始吧！</div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = '/api';
        // Token 存储的 key
        const TOKEN_KEY = 'todo_token';

        // ===== 1. 注册函数 =====
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
    
            if (!username || !password) {
                showMessage('请填写用户名和密码', 'error');
                return;
            }
    
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
    
                const data = await response.json();
    
                if (data.success) {
                    showMessage('注册成功，请登录');
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    showLogin();  // 自动切换到登录页
                } else {
                    showMessage(data.error, 'error');
                }
            }catch (error) {
                console.error('注册失败:', error);
                showMessage('注册失败，请重试', 'error');
            }
        }

        // ===== 2. 登录函数 =====
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
           
            if (!username || !password) {
                showMessage('请填写用户名和密码', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
    
                const data = await response.json();
    
                if (data.success) {
                    // 保存 token 到 localStorage
                    localStorage.setItem(TOKEN_KEY, data.token);
                    showMessage('登录成功');
        
                    // 隐藏登录页，显示 TODO 页
                    document.getElementById('loginUsername').value = '';
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('todoApp').style.display = 'block';
        
                    // 加载任务列表
                    fetchTasks();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showMessage('登录失败，请重试', 'error');
            }
        }

        // ===== 3. 退出登录 =====
        function logout() {
            localStorage.removeItem(TOKEN_KEY);
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('todoApp').style.display = 'none';
             showMessage('已退出登录');
        }

        // ===== 4. 页面切换函数 =====
        function showLogin() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('registerBox').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
        }

        // ===== 5. 检查是否已登录 =====
        function checkAuth() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (token) {
                 // 已登录，直接显示 TODO 页
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('todoApp').style.display = 'block';
                fetchTasks();
            } else {
                // 未登录，显示登录页
                document.getElementById('authContainer').style.display = 'block';
                document.getElementById('todoApp').style.display = 'none';
            }
        }
         
        // 显示消息提示
        function showMessage(message, type = 'success') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // 获取所有任务
        async function fetchTasks() {
            try {
                const token = localStorage.getItem(TOKEN_KEY);
                const response = await fetch(`${API_BASE}/tasks`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.status === 401) {
                    logout();
                    showMessage('登录已过期，请重新登录', 'error');
                    return;
                }
                
                const data = await response.json();

                if (data.success) {
                    renderTasks(data.tasks);
                    updateStats(data.stats);
                }
            } catch (error) {
                console.error('获取任务失败:', error);
                showMessage('获取任务失败，请刷新页面重试', 'error');
            }
        }

                // 添加任务
        async function addTask() {
            const input = document.getElementById('taskInput');
            const description = input.value.trim();

            if (!description) {
                showMessage('请输入任务描述', 'error');
                return;
            }

            try {
                const token = localStorage.getItem(TOKEN_KEY);
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ description })
                });

                if (response.status === 401) {
                    logout();
                    showMessage('登录已过期，请重新登录', 'error');
                    return;
                }

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message);
                    input.value = '';
                    fetchTasks(); // 刷新任务列表
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                console.error('添加任务失败:', error);
                showMessage('添加任务失败，请重试', 'error');
            }
        }

        // 切换任务状态
        async function toggleTask(taskId) {
            try {
                const token = localStorage.getItem(TOKEN_KEY);
                const response = await fetch(`${API_BASE}/tasks/${taskId}/toggle`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    logout();
                    showMessage('登录已过期，请重新登录', 'error');
                    return;
                }
                
                const data = await response.json();

                if (data.success) {
                    showMessage(data.message);
                    fetchTasks(); // 刷新任务列表
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                console.error('切换任务状态失败:', error);
                showMessage('操作失败，请重试', 'error');
            }
        }

                // 删除任务
        async function deleteTask(taskId) {
            if (!confirm('确定要删除这个任务吗？')) {
                return;
            }

            try {
                const token = localStorage.getItem(TOKEN_KEY);
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    logout();
                    showMessage('登录已过期，请重新登录', 'error');
                    return;
                }

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message);
                    fetchTasks(); // 刷新任务列表
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                console.error('删除任务失败:', error);
                showMessage('删除失败，请重试', 'error');
            }
        }

        // 更新统计信息
        function updateStats(stats) {
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('completedCount').textContent = stats.completed;
            document.getElementById('pendingCount').textContent = stats.pending;
        }

        // 渲染任务列表
        function renderTasks(tasks) {
            const taskList = document.getElementById('taskList');
            if (!tasks || tasks.length === 0) {
                taskList.innerHTML = '<li class="empty-state"><div>✨ 暂无任务</div><div style="font-size: 14px; margin-top: 10px;">添加一个新任务开始吧！</div></li>';
                return;
            }
             // 【关键修改】对任务进行排序：
             // 1. 未完成的排在前面（completed = false）
             // 2. 相同状态下，ID大的（新添加的）排在更前面
            const sortedTasks = [...tasks].sort((a, b) => {
            // 首先按完成状态排序：未完成的在前
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;  // false(未完成)排前面，true(完成)排后面
                }
                // 相同状态下，按ID倒序（新任务ID大，排前面）
                return b.id - a.id;
            });

            taskList.innerHTML = sortedTasks.map(task => `
                <li class="task-item ${task.completed ? 'completed' : ''}">
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <div class="task-content">
                        <div class="task-description">${escapeHtml(task.description)}</div>
                        <div class="task-meta">ID: ${task.id} | 创建于: ${task.created_at}</div>
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-secondary btn-sm" onclick="toggleTask(${task.id})">${task.completed ? '↩️ 撤销' : '✓ 完成'}</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">🗑️ 删除</button>
                    </div>
                </li>
            `).join('');
        }

        // 简单的XSS防护
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 支持回车键添加任务
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // 页面加载时根据登录状态初始化界面
        checkAuth();
        // 每30秒自动刷新一次（可选）
        setInterval(fetchTasks, 30000);
    </script>
</body>
</html>
