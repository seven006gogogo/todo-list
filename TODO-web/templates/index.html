<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的TODO列表工具 - 网页版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

:root{
    --primary:#667eea;
    --primary-2:#764ba2;
    --danger:#ff4757;
    --success:#00b894;
    --warning:#ff7a45;
    --text:#2d3436;
    --muted:#7b8794;
    --glass:rgba(255,255,255,0.84);
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background:#2b2f52 url('https://n.sinaimg.cn/sinakd20112/668/w2048h1020/20240227/6ee2-afa9253c6a9bd39ebc8e544315aead79.jpg') center/cover no-repeat fixed;
    min-height:100vh;
    color:var(--text);
}

/* ========== 通用按钮 ========== */
.btn{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    font-size:.92rem;
    cursor:pointer;
    transition:all .25s;
    font-weight:500;
    font-family:inherit;
}
.btn-primary{
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    color:#fff;
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(102,126,234,.38); }
.btn-primary:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-danger{ background:#ff4757; color:#fff; }
.btn-danger:hover{ background:#ff3838; }
.btn-sm{ padding:6px 12px; font-size:.8rem; }
.btn-block{ width:100%; display:block; }

/* ========== 消息提示 ========== */
.message{
    position:fixed;
    top:20px; left:50%;
    transform:translateX(-50%);
    padding:12px 24px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:9999;
    display:flex; align-items:center; gap:10px;
    font-weight:500; color:#333; font-size:.9rem;
    animation:slideDownFade .5s cubic-bezier(.68,-.55,.265,1.55) forwards;
    max-width:90vw;
}
.message.success{ border:1px solid rgba(0,184,148,.35); }
.message.error{ border:1px solid rgba(255,71,87,.35); }
.message.fade-out{ animation:slideUpFade .3s ease forwards; }
@keyframes slideDownFade{
    from{ opacity:0; transform:translate(-50%,-50px); }
    to{ opacity:1; transform:translate(-50%,0); }
}
@keyframes slideUpFade{
    from{ opacity:1; transform:translate(-50%,0); }
    to{ opacity:0; transform:translate(-50%,-50px); }
}

/* ============================================================
   一、登录 / 注册页
   ============================================================ */
#loginPage{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    padding:24px; overflow-y:auto;
    background:radial-gradient(circle at center, rgba(0,0,0,.10), rgba(0,0,0,.45));
}

.login-card{
    width:100%;
    max-width:420px;
    border-radius:24px;
    background:rgba(255,255,255,.16);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.34);
    box-shadow:0 25px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.55);
    padding:36px 32px 32px;
    animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{
    from{ opacity:0; transform:translateY(28px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.login-brand{ text-align:center; margin-bottom:22px; }
.login-brand .brand-icon{
    display:inline-block; font-size:2.8rem; line-height:1; margin-bottom:12px;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));
    animation:jellyFloat 3s ease-in-out infinite;
}
@keyframes jellyFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-8px) rotate(-3deg) scale(1.02); }
    75%{ transform:translateY(4px) rotate(3deg) scale(.98); }
}
.login-brand h1{
    font-size:1.65rem; color:#fff; letter-spacing:2px;
    text-shadow:0 2px 12px rgba(0,0,0,.4); margin-bottom:6px;
}
.login-brand p{ font-size:.85rem; color:rgba(255,255,255,.85); }

.field{ margin-bottom:14px; }
.field label{
    display:block; font-size:.78rem; letter-spacing:1px;
    color:rgba(255,255,255,.92); margin-bottom:6px;
}
.input{
    width:100%;
    padding:12px 15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.9);
    font-size:.92rem;
    font-family:inherit;
    color:#2d3436;
    transition:all .25s ease;
}
.input::placeholder{ color:#9aa3b2; }
.input:focus{
    outline:none; border-color:#667eea; background:#fff;
    box-shadow:0 0 0 4px rgba(102,126,234,.28);
}

.pw-wrap{ position:relative; }
.pw-wrap .input{ padding-right:44px; }
.pw-toggle{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:1rem; opacity:.55; user-select:none;
}
.pw-toggle:hover{ opacity:1; }

.captcha-row{ display:flex; gap:10px; }
.captcha-row .input{ flex:1; min-width:0; }
#captchaCanvas{
    border-radius:10px; cursor:pointer; flex-shrink:0;
    border:1px solid rgba(255,255,255,.5);
    background:#eef1ff;
}

.remember-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:6px 0 18px; font-size:.8rem;
}
.checkbox-label{
    display:flex; align-items:center; gap:7px;
    color:rgba(255,255,255,.92); cursor:pointer; user-select:none;
}
.checkbox-label input{ width:15px; height:15px; accent-color:#667eea; cursor:pointer; }
.link{ color:rgba(255,255,255,.88); cursor:pointer; text-decoration:underline; font-size:.8rem; }
.link:hover{ color:#fff; }

.login-hint{
    margin-top:14px; font-size:.72rem; text-align:center;
    color:rgba(255,255,255,.72); line-height:1.6;
}

/* ============================================================
   二、主应用（顶部导航 + 侧边栏 + 主内容）
   ============================================================ */
#appPage{ display:none; min-height:100vh; }

.topbar{
    position:sticky; top:0; z-index:60;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,.55);
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.topbar-inner{
    max-width:1200px; margin:0 auto;
    display:flex; align-items:center; gap:18px;
    padding:10px 20px;
}
.logo{
    font-family:'ZCOOL KuaiLe', cursive;
    font-size:1.35rem; white-space:nowrap; cursor:pointer;
    background:linear-gradient(135deg,#667eea,#764ba2);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    user-select:none;
}
.nav{ flex:1; display:flex; gap:6px; align-items:center; }

.user-menu{ position:relative; }
.user-btn{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.75);
    border:1px solid rgba(102,126,234,.22);
    padding:5px 12px 5px 5px; border-radius:999px;
    cursor:pointer; font-size:.88rem; font-family:inherit;
    color:#3d4451; transition:all .2s;
}
.user-btn:hover{ background:#fff; box-shadow:0 4px 14px rgba(102,126,234,.22); }
.avatar{
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:.8rem; font-weight:600; flex-shrink:0;
    overflow:hidden;
}
.avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.caret{ font-size:.7rem; opacity:.6; }

.dropdown{
    position:absolute; right:0; top:calc(100% + 10px);
    min-width:170px; background:#fff; border-radius:14px;
    box-shadow:0 14px 36px rgba(0,0,0,.18);
    padding:6px; display:none; z-index:70;
}
.dropdown.show{ display:block; animation:dropIn .18s ease; }
@keyframes dropIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
.dropdown a{
    display:block; padding:10px 12px; border-radius:9px;
    font-size:.86rem; color:#4a5568; cursor:pointer; transition:all .15s;
}
.dropdown a:hover{ background:#f2f4fb; color:#667eea; }
.dropdown a.danger:hover{ background:#fff0f1; color:#ff4757; }
.dropdown .divider{ height:1px; background:#eef0f5; margin:4px 6px; }

/* 布局 */
.layout{
    max-width:1200px; margin:20px auto; padding:0 20px 50px;
    display:grid; grid-template-columns:300px 1fr; gap:20px;
    align-items:start;
}
@media (max-width:900px){
    .layout{ grid-template-columns:1fr; }
    .topbar-inner{ flex-wrap:wrap; gap:10px; }
}

.card{
    background:var(--glass);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-radius:18px;
    box-shadow:0 12px 36px rgba(0,0,0,.14);
    padding:20px;
}

/* ========== 日历 ========== */
.cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
}
.cal-title{ font-weight:700; font-size:.98rem; color:#2d3436; }
.cal-nav{
    width:30px; height:30px; border-radius:9px; border:none; cursor:pointer;
    background:#eef1fb; color:#667eea; font-size:1.1rem; line-height:1;
    transition:all .2s; font-family:inherit;
}
.cal-nav:hover{ background:#667eea; color:#fff; }

.cal-week{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    margin-bottom:6px;
}
.cal-week span{ text-align:center; font-size:.7rem; color:var(--muted); }

.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-day{
    position:relative; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; cursor:pointer; background:#f3f4f9; color:#3d4451;
    transition:all .18s; user-select:none;
}
.cal-day:hover{ background:#e4e8f8; }
.cal-day.other{ color:#c9ced9; background:transparent; cursor:default; }
.cal-day.other:hover{ background:transparent; }
.cal-day.today{ box-shadow:inset 0 0 0 2px #667eea; font-weight:700; }
.cal-day.selected{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff; font-weight:700;
    box-shadow:0 4px 12px rgba(102,126,234,.4);
}
.cal-day .mark{
    position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
    line-height:1; font-size:.62rem;
}
.cal-day .dot{ width:5px; height:5px; border-radius:50%; background:var(--danger); display:block; }
.cal-day .tick{ color:var(--success); font-weight:700; font-size:.66rem; }
.cal-day.selected .dot{ background:#fff; }
.cal-day.selected .tick{ color:#b9f5e3; }

.cal-legend{
    display:flex; gap:14px; margin-top:14px;
    font-size:.7rem; color:var(--muted);
}
.cal-legend span{ display:flex; align-items:center; gap:5px; }
.lg-dot{ width:6px; height:6px; border-radius:50%; background:var(--danger); display:inline-block; }
.lg-tick{ color:var(--success); font-weight:700; }

/* ========== 主内容 ========== */
.card-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:4px; flex-wrap:wrap;
}
.card-head h2{ font-size:1.15rem; color:#2d3436; }
.card-head .sub{ font-size:.78rem; color:var(--muted); }

.stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    background:#f6f7fc; border-radius:14px;
    padding:14px; margin:16px 0; text-align:center;
}
.stat-number{ font-size:1.45rem; font-weight:700; color:#667eea; }
.stat-label{ font-size:.74rem; color:var(--muted); margin-top:2px; }

.add-box{ margin-bottom:18px; }
.input-group{ display:flex; gap:10px; margin-bottom:10px; }
.task-input{
    flex:1; padding:12px 15px;
    border:2px solid #e6e8f0; border-radius:12px;
    font-size:.92rem; font-family:inherit; background:#fff;
    transition:all .25s; color:#2d3436; min-width:0;
}
.task-input::placeholder{ color:#aab1bd; }
.task-input:focus{
    outline:none; border-color:#667eea;
    box-shadow:0 0 0 4px rgba(102,126,234,.12);
}

.type-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
}
.type-tabs{
    display:flex; gap:5px; background:#f0f2f9;
    padding:4px; border-radius:12px;
}
.type-tab{
    border:none; background:transparent;
    padding:7px 14px; border-radius:9px;
    font-size:.8rem; cursor:pointer; color:#6b7280;
    transition:all .2s; font-family:inherit; white-space:nowrap;
}
.type-tab:hover{ color:#667eea; }
.type-tab.active{
    background:#fff; color:#667eea; font-weight:600;
    box-shadow:0 2px 8px rgba(102,126,234,.18);
}

.date-range{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:.78rem; color:var(--muted);
}
.date-range label{ white-space:nowrap; }
.date-input{
    padding:7px 10px; border:2px solid #e6e8f0; border-radius:10px;
    font-size:.8rem; font-family:inherit; color:#3d4451; background:#fff;
}
.date-input:focus{ outline:none; border-color:#667eea; }

/* 任务列表 */
.task-list{ list-style:none; }
.task-item{
    display:flex; align-items:center; gap:12px;
    background:#fff; border-radius:14px; padding:14px;
    margin-bottom:10px; border:1px solid #eef0f6;
    transition:all .25s; animation:slideIn .3s ease;
}
@keyframes slideIn{
    from{ opacity:0; transform:translateX(-16px); }
    to{ opacity:1; transform:translateX(0); }
}
.task-item:hover{
    box-shadow:0 8px 22px rgba(102,126,234,.13);
    transform:translateY(-1px);
}
.task-item.completed{ opacity:.62; }
.task-checkbox{
    width:20px; height:20px; cursor:pointer;
    accent-color:#667eea; flex-shrink:0;
}
.task-content{ flex:1; min-width:0; }
.task-description{
    font-size:.93rem; color:#2d3436; word-break:break-word; line-height:1.45;
}
.task-item.completed .task-description{
    text-decoration:line-through; color:#9aa3b2;
}
.task-meta{
    font-size:.7rem; color:#9aa3b2; margin-top:6px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.badge{
    padding:2px 8px; border-radius:999px;
    font-size:.66rem; font-weight:600; white-space:nowrap;
}
.badge-normal{ background:#eef1fb; color:#667eea; }
.badge-daily{ background:#e6f9f3; color:#00b894; }
.badge-deadline{ background:#fff0e6; color:#ff7a45; }
.badge-overdue{ background:#ffe9eb; color:#ff4757; }

.empty-state{
    text-align:center; padding:38px 20px; color:#9aa3b2;
    font-size:.9rem; line-height:1.9;
}
.empty-state .big{ font-size:2.2rem; display:block; margin-bottom:6px; }

/* ========== 个人中心弹窗 ========== */
.modal-mask{
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
}
.modal-mask.show{ display:flex; }
.modal{
    width:100%; max-width:380px;
    background:#fff; border-radius:18px;
    padding:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.3);
    animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
    max-height:92vh; overflow-y:auto;
}
.modal h3{ font-size:1.05rem; margin-bottom:18px; text-align:center; }

.avatar-section{ text-align:center; margin-bottom:14px; }
.big-avatar{
    width:80px; height:80px; border-radius:50%;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:600; overflow:hidden;
    box-shadow:0 8px 20px rgba(102,126,234,.3);
    margin-bottom:10px;
}
.big-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

.avatar-actions{ display:flex; justify-content:center; gap:10px; align-items:center; }
.avatar-upload{
    display:inline-block; padding:6px 14px; border-radius:10px;
    background:#eef1fb; color:#667eea; font-size:.78rem;
    cursor:pointer; transition:all .2s;
}
.avatar-upload:hover{ background:#667eea; color:#fff; }
.link-dark{ color:#7b8794; text-decoration:underline; cursor:pointer; font-size:.78rem; }
.link-dark:hover{ color:#ff4757; }

.picker-label{ font-size:.74rem; color:var(--muted); display:block; margin:12px 0 8px; }
.picker-grid{
    display:grid; grid-template-columns:repeat(8,1fr); gap:6px;
    margin-bottom:16px;
}
.picker-grid span{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; border-radius:10px; cursor:pointer;
    background:#f6f7fc; transition:all .18s;
}
.picker-grid span:hover{ background:#e4e8f8; transform:scale(1.1); }

.field-modal{ margin-bottom:12px; }
.field-modal label{
    display:block; font-size:.78rem; color:var(--muted);
    margin-bottom:6px;
}
.field-modal .input{
    width:100%; padding:10px 12px; border-radius:10px;
    border:2px solid #e6e8f0; background:#fff; font-size:.9rem;
    font-family:inherit; color:#2d3436;
}
.field-modal .input:focus{
    outline:none; border-color:#667eea;
    box-shadow:0 0 0 4px rgba(102,126,234,.12);
}

.profile-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid #f0f2f7;
    font-size:.86rem; color:var(--muted);
}
.profile-row b{ color:#2d3436; font-weight:600; }

.modal-actions{ display:flex; gap:10px; margin-top:18px; }
.modal-actions .btn{ flex:1; }

@media (max-width:600px){
    .input-group{ flex-direction:column; }
    .stats{ padding:12px 6px; }
    .stat-number{ font-size:1.2rem; }
    .card{ padding:16px; }
    .login-card{ padding:28px 22px; }
    .picker-grid{ grid-template-columns:repeat(6,1fr); }
}
</style>
</head>
<body>

<!-- ============================================================
     一、登录 / 注册页
     ============================================================ -->
<div id="loginPage">
    <div class="login-card">

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="login-brand">
                <div class="brand-icon">📝</div>
                <h1>欢迎回来</h1>
                <p>登录后开始管理你的每日待办</p>
            </div>

            <div class="field">
                <label>账号（手机号）</label>
                <input type="tel" id="loginPhone" class="input" maxlength="11"
                       placeholder="请输入 11 位手机号" autocomplete="username">
            </div>

            <div class="field">
                <label>密码</label>
                <div class="pw-wrap">
                    <input type="password" id="loginPassword" class="input"
                           placeholder="请输入密码" autocomplete="current-password">
                    <span class="pw-toggle" onclick="togglePw('loginPassword', this)">👁</span>
                </div>
            </div>

            <div class="remember-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe"> 记住我
                </label>
                <span class="link" onclick="switchToRegister()">没有账号？去注册</span>
            </div>

            <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">登 录</button>

            <p class="login-hint">
                账号请使用手机号登录<br>
                若服务器不可用，将自动使用本地账号模式
            </p>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" style="display:none">
            <div class="login-brand">
                <div class="brand-icon">✨</div>
                <h1>创建账号</h1>
                <p>注册后开始使用待办清单</p>
            </div>

            <div class="field">
                <label>手机号</label>
                <input type="tel" id="regPhone" class="input" maxlength="11"
                       placeholder="请输入 11 位手机号" autocomplete="off">
            </div>

            <div class="field">
                <label>密码</label>
                <div class="pw-wrap">
                    <input type="password" id="regPassword" class="input"
                           placeholder="至少 6 位密码" autocomplete="new-password">
                    <span class="pw-toggle" onclick="togglePw('regPassword', this)">👁</span>
                </div>
            </div>

            <div class="field">
                <label>确认密码</label>
                <div class="pw-wrap">
                    <input type="password" id="regConfirm" class="input"
                           placeholder="请再次输入密码" autocomplete="new-password">
                    <span class="pw-toggle" onclick="togglePw('regConfirm', this)">👁</span>
                </div>
            </div>

            <div class="field">
                <label>图形验证码</label>
                <div class="captcha-row">
                    <input type="text" id="regCaptcha" class="input" maxlength="4"
                           placeholder="请输入验证码" autocomplete="off">
                    <canvas id="captchaCanvas" title="点击刷新验证码" onclick="refreshCaptcha()"></canvas>
                </div>
            </div>

<script>
/* ============================================================
   0. 常量 & 工具函数
   ============================================================ */
const API_BASE      = '/api';
const K_SESSION     = 'todo_session_v1';
const K_REMEMBER    = 'todo_remember_v1';
const K_USERS       = 'todo_users_v1';
const K_TASK_PREFIX = 'todo_tasks_v1_';
const K_PROFILE_PREFIX = 'todo_profile_v1_';

const pad2 = n => String(n).padStart(2, '0');

function fmtDate(d){
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function todayStr(){ return fmtDate(new Date()); }
function dateOffset(n){
    const d = new Date();
    d.setDate(d.getDate() + n);
    return fmtDate(d);
}
function parseDate(s){
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
}
function formatDateCN(s){
    const dt = parseDate(s);
    const week = ['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()];
    return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日 ${week}`;
}
function esc(text){
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}
function simpleHash(str){
    let h = 0;
    for (let i = 0; i < str.length; i++){
        h = (h << 5) - h + str.charCodeAt(i);
        h |= 0;
    }
    return 'h' + h;
}

function showMessage(message, type = 'success'){
    const div = document.createElement('div');
    div.className = `message ${type}`;
    const icon = type === 'success' ? '✨' : '⚠️';
    div.innerHTML = `<span>${icon}</span><span>${esc(message)}</span>`;
    document.body.appendChild(div);
    setTimeout(() => {
        div.classList.add('fade-out');
        setTimeout(() => div.remove(), 300);
    }, 2600);
}

/* ============================================================
   1. 图形验证码（Canvas）
   ============================================================ */
let captchaCode = '';

function setupCanvas(){
    const canvas = document.getElementById('captchaCanvas');
    const dpr = window.devicePixelRatio || 1;
    const w = 130, h = 44;
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    canvas._w = w;
    canvas._h = h;
    canvas._dpr = dpr;
}

function refreshCaptcha(){
    const canvas = document.getElementById('captchaCanvas');
    if (!canvas) return;
    if (!canvas._w) setupCanvas();
    const ctx = canvas.getContext('2d');
    const w = canvas._w, h = canvas._h, dpr = canvas._dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#eef1ff');
    grad.addColorStop(1, '#e8e1f8');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const chars = 'ABCDEFGHJKLMNPQRSTUVWXY23456789';
    captchaCode = '';
    for (let i = 0; i < 4; i++){
        captchaCode += chars[Math.floor(Math.random() * chars.length)];
    }

    for (let i = 0; i < 5; i++){
        ctx.beginPath();
        ctx.moveTo(Math.random() * w, Math.random() * h);
        ctx.lineTo(Math.random() * w, Math.random() * h);
        ctx.strokeStyle = `hsla(${Math.random() * 360},70%,65%,0.65)`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    for (let i = 0; i < 36; i++){
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${Math.random() * 360},70%,60%,0.6)`;
        ctx.fill();
    }

    for (let i = 0; i < captchaCode.length; i++){
        ctx.save();
        ctx.font = `${20 + Math.random() * 5}px 'ZCOOL KuaiLe', 'Comic Sans MS', sans-serif`;
        ctx.fillStyle = `hsl(${Math.random() * 360}, 62%, 42%)`;
        ctx.textBaseline = 'middle';
        const x = 16 + i * 28;
        const y = h / 2 + (Math.random() * 6 - 3);
        ctx.translate(x, y);
        ctx.rotate((Math.random() - 0.5) * 0.5);
        ctx.fillText(captchaCode[i], 0, 0);
        ctx.restore();
    }
}

/* ============================================================
   2. 登录 / 注册 / 会话
   ============================================================ */
let currentUser = null;
let tasks = [];
let selectedDate = todayStr();
let calCursor = new Date();
let currentType = 'normal';
let tempAvatar = '';   // 个人中心临时头像（保存前）

function togglePw(id, el){
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    el.textContent = input.type === 'password' ? '👁' : '🙈';
}

function switchToRegister(){
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    setupCanvas();
    refreshCaptcha();
    setTimeout(() => document.getElementById('regPhone').focus(), 30);
}
function switchToLogin(){
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    setTimeout(() => document.getElementById('loginPhone').focus(), 30);
}

/* ---- 注册 ---- */
async function doRegister(){
    const phone   = document.getElementById('regPhone').value.trim();
    const pwd     = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    const captcha = document.getElementById('regCaptcha').value.trim();

    if (!/^1[3-9]\d{9}$/.test(phone)){
        showMessage('请输入正确的 11 位手机号', 'error');
        return;
    }
    if (!pwd || pwd.length < 6){
        showMessage('密码长度至少 6 位', 'error');
        return;
    }
    if (pwd !== confirm){
        showMessage('两次输入的密码不一致', 'error');
        return;
    }
    if (!captcha){
        showMessage('请输入图形验证码', 'error');
        return;
    }
    if (captcha.toUpperCase() !== captchaCode.toUpperCase()){
        showMessage('验证码错误，请重新输入', 'error');
        refreshCaptcha();
        document.getElementById('regCaptcha').value = '';
        return;
    }

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
        const res = await fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: phone, password: pwd })
        });
        const data = await res.json();

        if (data.success){
            showMessage('注册成功，请登录');
            document.getElementById('regPhone').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirm').value = '';
            document.getElementById('regCaptcha').value = '';
            // 预填手机号到登录页
            document.getElementById('loginPhone').value = phone;
            switchToLogin();
        } else {
            showMessage(data.error || '注册失败', 'error');
            refreshCaptcha();
            document.getElementById('regCaptcha').value = '';
        }
    } catch (err){
        console.warn('后端不可用，使用本地注册：', err);
        localRegister(phone, pwd);
    } finally {
        btn.disabled = false;
        btn.textContent = '注 册';
    }
}

function localRegister(phone, pwd){
    let users = {};
    try { users = JSON.parse(localStorage.getItem(K_USERS) || '{}'); } catch(e){ users = {}; }

    if (users[phone]){
        showMessage('该手机号已注册，请直接登录', 'error');
        return;
    }
    users[phone] = simpleHash(pwd);
    localStorage.setItem(K_USERS, JSON.stringify(users));
    showMessage('注册成功，请登录');
    document.getElementById('regPhone').value = '';
    document.getElementById('regPassword').value = '';
    document.getElementById('regConfirm').value = '';
    document.getElementById('regCaptcha').value = '';
    document.getElementById('loginPhone').value = phone;
    switchToLogin();
}

/* ---- 登录 ---- */
async function doLogin(){
    const phone = document.getElementById('loginPhone').value.trim();
    const pwd   = document.getElementById('loginPassword').value;

    if (!/^1[3-9]\d{9}$/.test(phone)){
        showMessage('请输入正确的 11 位手机号', 'error');
        return;
    }
    if (!pwd || pwd.length < 6){
        showMessage('密码长度至少 6 位', 'error');
        return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
        const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: phone, password: pwd })
        });
        const data = await res.json();

        if (data.success){
            finishLogin(phone, data.token || 'server-token');
        } else {
            showMessage(data.error || '登录失败', 'error');
        }
    } catch (err){
        console.warn('后端不可用，切换本地账号模式：', err);
        localLogin(phone, pwd);
    } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
    }
}

function localLogin(phone, pwd){
    let users = {};
    try { users = JSON.parse(localStorage.getItem(K_USERS) || '{}'); } catch(e){ users = {}; }

    const hashed = simpleHash(pwd);
    if (users[phone]){
        if (users[phone] !== hashed){
            showMessage('手机号或密码错误', 'error');
            return;
        }
    } else {
        showMessage('该手机号尚未注册，请先注册', 'error');
        return;
    }
    finishLogin(phone, 'local-' + Date.now());
}

function finishLogin(phone, token){
    const remember = document.getElementById('rememberMe').checked;
    const saved = loadUserProfile(phone) || {};
    const session = {
        phone,
        token,
        nickname: saved.nickname || ('用户' + phone.slice(-4)),
        avatar: saved.avatar || '',
        loginAt: Date.now()
    };

    if (remember){
        localStorage.setItem(K_SESSION, JSON.stringify(session));
        localStorage.setItem(K_REMEMBER, phone);
        sessionStorage.removeItem(K_SESSION);
    } else {
        sessionStorage.setItem(K_SESSION, JSON.stringify(session));
        localStorage.removeItem(K_SESSION);
        localStorage.removeItem(K_REMEMBER);
    }

    document.getElementById('loginPassword').value = '';
    showMessage('登录成功');
    enterApp(session);
}

function checkSession(){
    let raw = sessionStorage.getItem(K_SESSION) || localStorage.getItem(K_SESSION);
    if (raw){
        try {
            const s = JSON.parse(raw);
            if (s && s.phone){ enterApp(s); return; }
        } catch(e){ /* ignore */ }
    }
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('appPage').style.display = 'none';
}

function logout(){
    localStorage.removeItem(K_SESSION);
    sessionStorage.removeItem(K_SESSION);
    currentUser = null;
    tasks = [];

    document.getElementById('appPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('userDropdown').classList.remove('show');

    const remembered = localStorage.getItem(K_REMEMBER);
    if (remembered){
        document.getElementById('loginPhone').value = remembered;
        document.getElementById('rememberMe').checked = true;
    } else {
        document.getElementById('loginPhone').value = '';
        document.getElementById('rememberMe').checked = false;
    }
    switchToLogin();
    refreshCaptcha();
    showMessage('已退出登录');
}

function enterApp(session){
    currentUser = session;

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';

    renderUserInfo();

    tasks = loadTasks();
    const removed = runCleanup();
    if (removed > 0){
        showMessage(`已自动清理 ${removed} 条过期任务`);
    }

    selectedDate = todayStr();
    calCursor = new Date();

    renderAll();
}

/* ============================================================
   3. 用户资料（昵称、头像）
   ============================================================ */
function loadUserProfile(phone){
    try {
        return JSON.parse(localStorage.getItem(K_PROFILE_PREFIX + phone) || 'null');
    } catch(e){ return null; }
}
function saveUserProfileStorage(phone, profile){
    localStorage.setItem(K_PROFILE_PREFIX + phone, JSON.stringify(profile));
}
function persistSession(){
    if (!currentUser) return;
    const s = { ...currentUser };
    if (sessionStorage.getItem(K_SESSION)){
        sessionStorage.setItem(K_SESSION, JSON.stringify(s));
    }
    if (localStorage.getItem(K_SESSION)){
        localStorage.setItem(K_SESSION, JSON.stringify(s));
    }
}

function renderUserInfo(){
    if (!currentUser) return;
    const av = document.getElementById('userAvatar');
    av.innerHTML = '';
    av.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';
    if (currentUser.avatar && currentUser.avatar.startsWith('data:')){

        av.appendChild(img);
    } else if (currentUser.avatar){
        av.textContent = currentUser.avatar;

}

/* ============================================================
   4. 数据存储（localStorage）
   ============================================================ */
function taskKey(){
    return K_TASK_PREFIX + (currentUser ? currentUser.phone : 'guest');
}
function loadTasks(){
    try {
        const raw = localStorage.getItem(taskKey());
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
    } catch(e){
        console.error('读取任务失败:', e);
        return [];
    }
}
function saveTasks(){
    try {
        localStorage.setItem(taskKey(), JSON.stringify(tasks));
    } catch(e){
        console.error('保存任务失败:', e);
        showMessage('本地存储写入失败', 'error');
    }
}

/* ============================================================
   5. ★ 数据清理与保留机制
   ------------------------------------------------------------
   - 普通(normal)    ：只保留「今天」和「昨天」创建的，前天及更早一律清除
   - 每日必做(daily) ：永不清除（但只在 startDate ~ endDate 区间显示）
   - 限时(deadline)  ：未超期保留；超期后转为普通任务，
                       以「截止日期」作为创建日期参与普通任务清理
   ============================================================ */
function runCleanup(){
    const today     = todayStr();
    const yesterday = dateOffset(-1);
    const before    = tasks.length;
    const kept      = [];

    for (const t of tasks){
        // 每日必做：永不删除
        if (t.type === 'daily'){
            kept.push(t);
            continue;
        }

        // 限时任务
        if (t.type === 'deadline' && t.deadline){
            if (today <= t.deadline){
                kept.push(t);
                continue;
            }
            // 超期 → 转普通任务
            t.type     = 'normal';
            t.date     = t.deadline;
            t.deadline = null;
        }

        // 普通任务：只保留今天和昨天
        if (t.date === today || t.date === yesterday){
            kept.push(t);
        }
    }

    const removed = before - kept.length;
    if (removed > 0){
        tasks = kept;
        saveTasks();
    }
    return removed;
}

/* ============================================================
   6. 任务查询辅助
   ============================================================ */
function getTasksForDate(d){
    return tasks.filter(t => {
        if (t.type === 'daily'){
            const s = t.startDate || t.date;
            const e = t.endDate   || '9999-12-31';
            return d >= s && d <= e;
        }
        if (t.type === 'deadline' && t.deadline){
            return d >= t.date && d <= t.deadline;
        }
        return t.date === d;
    });
}

/* ★ 关键修复：每天的完成状态独立保存 */
function isDoneOn(t, d){
    return (t.completedDates || []).includes(d);
}

/* ============================================================
   7. 日历渲染
   ============================================================ */
function calMove(delta){
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + delta, 1);
    renderCalendar();
}

function renderCalendar(){
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();

    document.getElementById('calTitle').textContent = `${y}年${m + 1}月`;

    const firstWeekday = new Date(y, m, 1).getDay();
    const daysInMonth  = new Date(y, m + 1, 0).getDate();
    const daysInPrev   = new Date(y, m, 0).getDate();

    const cells = [];
    for (let i = firstWeekday - 1; i >= 0; i--){
        const d = daysInPrev - i;
        cells.push({ day: d, other: true, date: fmtDate(new Date(y, m - 1, d)) });
    }
    for (let d = 1; d <= daysInMonth; d++){
        cells.push({ day: d, other: false, date: fmtDate(new Date(y, m, d)) });
    }
    let nd = 1;
    while (cells.length % 7 !== 0){
        cells.push({ day: nd, other: true, date: fmtDate(new Date(y, m + 1, nd)) });
        nd++;
    }

    const today = todayStr();

    document.getElementById('calGrid').innerHTML = cells.map(c => {
        if (c.other){
            return `<div class="cal-day other">${c.day}</div>`;
        }

        const dayTasks = getTasksForDate(c.date);
        let mark = '';
        if (dayTasks.length > 0){
            const allDone = dayTasks.every(t => isDoneOn(t, c.date));
            mark = allDone
                ? `<span class="mark tick">✓</span>`
                : `<span class="mark dot"></span>`;
        }

        const cls = ['cal-day'];
        if (c.date === today)        cls.push('today');
        if (c.date === selectedDate) cls.push('selected');

        return `<div class="${cls.join(' ')}" onclick="selectDate('${c.date}')">${c.day}${mark}</div>`;
    }).join('');
}

function selectDate(d){
    selectedDate = d;
    const dt = parseDate(d);
    if (dt.getFullYear() !== calCursor.getFullYear() || dt.getMonth() !== calCursor.getMonth()){
        calCursor = new Date(dt.getFullYear(), dt.getMonth(), 1);
    }
    renderAll();
}

function goHome(){
    selectedDate = todayStr();
    calCursor = new Date();
    renderAll();
}

/* ============================================================
   8. 主内容渲染
   ============================================================ */
function renderAll(){
    renderCalendar();
    renderDateHeader();
    renderStats();
    renderTasks();
}

function renderDateHeader(){
    const t = todayStr();
    let label = selectedDate;
    if (selectedDate === t)                    label = '今天';
    else if (selectedDate === dateOffset(-1))  label = '昨天';
    else if (selectedDate === dateOffset(1))   label = '明天';

    document.getElementById('dateTitle').textContent = `${label}的任务`;
    document.getElementById('dateSub').textContent   = formatDateCN(selectedDate);
}

function renderStats(){
    const list = getTasksForDate(selectedDate);
    const total = list.length;
    const done  = list.filter(t => isDoneOn(t, selectedDate)).length;

    document.getElementById('totalCount').textContent     = total;
    document.getElementById('completedCount').textContent = done;
    document.getElementById('pendingCount').textContent   = total - done;
}

function badgeOf(t){
    if (t.type === 'daily'){
        const s = t.startDate || t.date;
        const e = t.endDate   || '长期';
        return `<span class="badge badge-daily">每日必做 · ${s} ~ ${e}</span>`;
    }
    if (t.type === 'deadline' && t.deadline){
        const overdue = todayStr() > t.deadline;
        return overdue
            ? `<span class="badge badge-overdue">已超期 · ${t.deadline}</span>`
            : `<span class="badge badge-deadline">限时 · 截止 ${t.deadline}</span>`;
    }
    return `<span class="badge badge-normal">普通</span>`;
}

function renderTasks(){
    const listEl = document.getElementById('taskList');
    const dayTasks = getTasksForDate(selectedDate);

    const sorted = [...dayTasks].sort((a, b) => {
        const da = isDoneOn(a, selectedDate) ? 1 : 0;
        const db = isDoneOn(b, selectedDate) ? 1 : 0;
        if (da !== db) return da - db;
        return (b.createdAt || 0) - (a.createdAt || 0);
    });

    if (sorted.length === 0){
        listEl.innerHTML = `
            <li class="empty-state">
                <span class="big">✨</span>
                这一天还没有任务<br>
                <span style="font-size:.8rem">在上方输入框添加一个新任务吧！</span>
            </li>`;
        return;
    }

    listEl.innerHTML = sorted.map(t => {
        const done = isDoneOn(t, selectedDate);
        return `
            <li class="task-item ${done ? 'completed' : ''}">
                <input type="checkbox" class="task-checkbox"
                       ${done ? 'checked' : ''} onchange="toggleTask(${t.id})">
                <div class="task-content">
                    <div class="task-description">${esc(t.title)}</div>
                    <div class="task-meta">
                        ${badgeOf(t)}
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})" title="删除">🗑️</button>
                </div>
            </li>`;
    }).join('');
}

/* ============================================================
   9. 任务增删改
   ============================================================ */
function setType(type){
    currentType = type;
    document.querySelectorAll('.type-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.type === type);
    });

    document.getElementById('dailyRange').style.display   = (type === 'daily')    ? 'flex' : 'none';
    document.getElementById('deadlineWrap').style.display = (type === 'deadline') ? 'flex' : 'none';

    if (type === 'daily'){
        const s = document.getElementById('dailyStart');
        const e = document.getElementById('dailyEnd');
        if (!s.value) s.value = todayStr();
        if (!e.value){
            const d = new Date();
            d.setDate(d.getDate() + 30);
            e.value = fmtDate(d);
        }
    }
    if (type === 'deadline' && !document.getElementById('deadlineInput').value){
        document.getElementById('deadlineInput').value = todayStr();
    }
}

function addTask(){
    const input = document.getElementById('taskInput');
    const title = input.value.trim();

    if (!title){
        showMessage('请输入任务内容', 'error');
        input.focus();
        return;
    }

    const id = Date.now() + Math.floor(Math.random() * 1000);
    const now = Date.now();

    if (currentType === 'normal'){
        const taskDate = selectedDate < todayStr() ? todayStr() : selectedDate;
        tasks.push({
            id, title, type: 'normal',
            date: taskDate,
            completedDates: [],
            createdAt: now
        });
    } else if (currentType === 'daily'){
        const s = document.getElementById('dailyStart').value;
        const e = document.getElementById('dailyEnd').value;
        if (!s || !e){
            showMessage('请选择开始和结束日期', 'error');
            return;
        }
        if (e < s){
            showMessage('结束日期不能早于开始日期', 'error');
            return;
        }
        tasks.push({
            id, title, type: 'daily',
            date: todayStr(),
            startDate: s,
            endDate: e,
            completedDates: [],
            createdAt: now
        });
    } else if (currentType === 'deadline'){
        const dl = document.getElementById('deadlineInput').value;
        if (!dl){
            showMessage('请选择截止日期', 'error');
            return;
        }
        if (dl < todayStr()){
            showMessage('截止日期不能早于今天', 'error');
            return;
        }
        tasks.push({
            id, title, type: 'deadline',
            date: todayStr(),
            deadline: dl,
            completedDates: [],
            createdAt: now
        });
    }

    saveTasks();
    input.value = '';

    const tip = currentType === 'daily'    ? '已添加每日必做'
              : currentType === 'deadline' ? '已添加限时任务'
              : '已添加任务';
    showMessage(tip);

    renderAll();
    input.focus();
}

/* ★ 关键修复：按日期独立切换完成状态 */
function toggleTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t) return;

    if (!Array.isArray(t.completedDates)) t.completedDates = [];

    const d = selectedDate;
    const idx = t.completedDates.indexOf(d);
    if (idx >= 0){
        t.completedDates.splice(idx, 1);
    } else {
        t.completedDates.push(d);
    }

    saveTasks();
    renderAll();
}

function deleteTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (!confirm(`确定要删除任务「${t.title}」吗？`)) return;

    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    showMessage('已删除任务');
    renderAll();
}

/* ============================================================
   10. 用户菜单 & 个人中心
   ============================================================ */
function toggleUserMenu(e){
    e.stopPropagation();
    document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', () => {
    document.getElementById('userDropdown').classList.remove('show');
});

function openProfile(){
    if (!currentUser) return;
    tempAvatar = currentUser.avatar || '';

    document.getElementById('pNickInput').value = currentUser.nickname;
    document.getElementById('pPhone').textContent =
        currentUser.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
    document.getElementById('pTotal').textContent = tasks.length;
    document.getElementById('pDone').textContent  =
        tasks.filter(t => (t.completedDates || []).length > 0).length;

    updateBigAvatar();
    document.getElementById('profileModal').classList.add('show');
    document.getElementById('userDropdown').classList.remove('show');
}
function closeProfile(){
    document.getElementById('profileModal').classList.remove('show');
}
document.getElementById('profileModal').addEventListener('click', e => {
    if (e.target.id === 'profileModal') closeProfile();
});

function updateBigAvatar(){
    const el = document.getElementById('bigAvatar');
    el.innerHTML = '';
    el.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';

    if (tempAvatar && tempAvatar.startsWith('data:')){
        const img = document.createElement('img');
        img.src = tempAvatar;
        el.appendChild(img);
    } else if (tempAvatar){
        el.textContent = tempAvatar;
    } else if (currentUser){
        el.textContent = (currentUser.nickname || '用').slice(-1);
    } else {
        el.textContent = '用';
    }
}

function pickAvatar(emoji){
    tempAvatar = emoji;
    updateBigAvatar();
}
function clearAvatar(){
    tempAvatar = '';
    updateBigAvatar();
}
function handleAvatarUpload(event){
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')){
        showMessage('请选择图片文件', 'error');
        return;
    }
    if (file.size > 5 * 1024 * 1024){
        showMessage('图片不能超过 5MB', 'error');
        return;
    }

    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const size = 96;
            const canvas = document.createElement('canvas');
            canvas.width  = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const s = Math.min(img.width, img.height);
            const sx = (img.width - s) / 2;
            const sy = (img.height - s) / 2;
            ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
            tempAvatar = canvas.toDataURL('image/jpeg', 0.85);
            updateBigAvatar();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function saveProfile(){
    const nick = document.getElementById('pNickInput').value.trim();
    if (!nick){
        showMessage('昵称不能为空', 'error');
        return;
    }
    if (nick.length > 20){
        showMessage('昵称最长 20 个字', 'error');
        return;
    }

    currentUser.nickname = nick;
    currentUser.avatar   = tempAvatar;

    saveUserProfileStorage(currentUser.phone, {
        nickname: nick,
        avatar: tempAvatar
    });
    persistSession();
    renderUserInfo();
    closeProfile();
    showMessage('个人信息已保存');
}

/* ============================================================
   11. 初始化
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    setupCanvas();
    refreshCaptcha();

    const remembered = localStorage.getItem(K_REMEMBER);
    if (remembered){
        document.getElementById('loginPhone').value = remembered;
        document.getElementById('rememberMe').checked = true;
    }

    // 回车快捷键
    document.getElementById('taskInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') addTask();
    });

    ['loginPhone', 'loginPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    });
    ['regPhone', 'regPassword', 'regConfirm', 'regCaptcha'].forEach(id => {
        document.getElementById(id).addEventListener('keypress', e => {
            if (e.key === 'Enter') doRegister();
        });
    });

    checkSession();
});
